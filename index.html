<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MovieDate</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- =========================================
       ROOM START SCREEN
  ========================================== -->

  <div class="room-gate" id="roomGate">

    <div class="gate-card">

      <div class="gate-logo">
        Movie<span>Date</span>
      </div>

      <p class="gate-subtitle">
        Watch together. Anywhere.
      </p>

      <button
        id="createRoomBtn"
        class="gate-primary"
        type="button"
      >
        Create a room
      </button>

      <button
        id="joinPromptBtn"
        class="gate-secondary"
        type="button"
      >
        Join with code
      </button>

    </div>

  </div>


  <!-- =========================================
       JOIN ROOM SHEET
  ========================================== -->

  <div
    class="join-sheet hidden"
    id="joinSheet"
  >

    <div class="join-card">

      <button
        id="closeJoinBtn"
        class="join-close"
        type="button"
      >
        ×
      </button>

      <h2>Join a room</h2>

      <p>
        Enter the room code from your partner.
      </p>

      <input
        id="roomCodeInput"
        type="text"
        maxlength="12"
        placeholder="ROOM CODE"
        autocomplete="off"
        autocapitalize="characters"
      >

      <button
        id="joinRoomBtn"
        class="gate-primary"
        type="button"
      >
        Join room
      </button>

    </div>

  </div>


  <!-- =========================================
       WATCH APP
  ========================================== -->

  <main
    class="app hidden"
    id="app"
  >

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="brand">
        Movie<span>Date</span>
      </div>

      <div class="room-info">
        <span>ROOM</span>
        <strong id="roomCode">----</strong>
      </div>

      <button
        id="shareRoomBtn"
        type="button"
      >
        Share
      </button>

      <button
        id="exitBtn"
        type="button"
      >
        Exit
      </button>

    </header>


    <!-- =====================================
         WATCH AREA
    ====================================== -->

    <section class="watch-layout">


      <!-- MOVIE -->

      <div class="movie-section">

        <div
          class="movie-container"
          id="movieTap"
        >

          <video
            id="movie"
            playsinline
            preload="metadata"
          ></video>

          <div
            id="emptyState"
            class="movie-empty"
          >

            <div class="empty-title">
              Choose a movie
            </div>

            <div class="empty-text">
              Pick a movie from your device
            </div>

            <button
              id="chooseMovieBtn"
              type="button"
            >
              Choose movie
            </button>

            <input
              id="movieFile"
              type="file"
              accept="video/mp4,video/webm,.mp4,.webm"
              hidden
            >

          </div>


          <!-- MOVIE CONTROLS -->

          <div class="movie-controls">

            <button
              id="playBtn"
              type="button"
            >
              ▶
            </button>

            <input
              id="seekBar"
              type="range"
              min="0"
              max="100"
              value="0"
            >

            <span id="movieTime">
              00:00
            </span>

            <button
              id="muteBtn"
              type="button"
            >
              🔊
            </button>

            <button
              id="fullscreenBtn"
              type="button"
            >
              ⛶
            </button>

          </div>

        </div>

      </div>


      <!-- =====================================
           PEOPLE / CHAT
      ====================================== -->

      <aside class="people">


        <!-- CAMERA 1 -->

        <div class="person-card">

          <div class="camera-box">

            <video
              id="localVideo"
              autoplay
              muted
              playsinline
            ></video>

            <div class="person-name">
              You
            </div>

          </div>

        </div>


        <!-- CAMERA 2 -->

        <div class="person-card">

          <div class="camera-box">

            <video
              id="remoteVideo"
              autoplay
              playsinline
            ></video>

            <div class="person-name">
              Partner
            </div>

          </div>

        </div>


        <!-- CHAT -->

        <div class="chat-panel">

          <div
            id="messages"
            class="messages"
          ></div>

          <form
            id="chatForm"
            class="chat-form"
          >

            <input
              id="chatInput"
              type="text"
              placeholder="Message..."
              autocomplete="off"
            >

            <button
              id="sendChat"
              type="submit"
            >
              Send
            </button>

          </form>

        </div>

      </aside>

    </section>


    <!-- =====================================
         BOTTOM CONTROLS
    ====================================== -->

    <footer class="bottom-controls">

      <button
        id="micBtn"
        type="button"
      >
        🎙
      </button>

      <button
        id="cameraBtn"
        type="button"
      >
        📷
      </button>

      <button
        id="shareBtn"
        type="button"
      >
        🖥
      </button>

      <div class="reactions">

        <button
          class="reaction-btn"
          data-emoji="❤️"
          type="button"
        >
          ❤️
        </button>

        <button
          class="reaction-btn"
          data-emoji="🥰"
          type="button"
        >
          🥰
        </button>

        <button
          class="reaction-btn"
          data-emoji="😘"
          type="button"
        >
          😘
        </button>

        <button
          class="reaction-btn"
          data-emoji="😂"
          type="button"
        >
          😂
        </button>

        <button
          class="reaction-btn"
          data-emoji="🔥"
          type="button"
        >
          🔥
        </button>

      </div>

    </footer>

  </main>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- SOCKET.IO -->

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <!-- APP -->

  <script src="./app.js"></script>

</body>
</html>
