<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>MovieDate</title>

  <link rel="stylesheet" href="./style.css">

</head>


<body>


  <!-- =====================================================
       ROOM START SCREEN
       ===================================================== -->

  <div
    id="roomGate"
    class="room-gate"
  >

    <div class="gate-card">

      <div class="gate-logo">
        Movie<span>Date</span>
      </div>

      <p class="gate-subtitle">
        Watch together. Anywhere.
      </p>


      <button
        id="createRoomBtn"
        class="gate-primary"
        type="button"
      >
        Create a room
      </button>


      <button
        id="joinPromptBtn"
        class="gate-secondary"
        type="button"
      >
        Join with code
      </button>

    </div>

  </div>



  <!-- =====================================================
       JOIN ROOM
       ===================================================== -->

  <div
    id="joinSheet"
    class="join-sheet hidden"
  >

    <div class="join-card">


      <button
        id="closeJoinBtn"
        class="join-close"
        type="button"
        aria-label="Close"
      >
        ×
      </button>


      <h2>
        Join a room
      </h2>


      <p>
        Enter the room code from your partner.
      </p>


      <input
        id="roomCodeInput"
        type="text"
        maxlength="12"
        placeholder="ROOM CODE"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >


      <button
        id="joinRoomBtn"
        class="gate-primary"
        type="button"
      >
        Join room
      </button>


    </div>

  </div>



  <!-- =====================================================
       MAIN WATCH APP
       ===================================================== -->

  <main
    id="app"
    class="app hidden"
  >


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <header class="topbar">


      <div class="brand">
        Movie<span>Date</span>
      </div>


      <div class="room-info">

        <span>
          ROOM
        </span>

        <strong id="roomCode">
          ----
        </strong>

      </div>


      <button
        id="shareRoomBtn"
        type="button"
      >
        Share
      </button>


      <button
        id="exitBtn"
        type="button"
      >
        Exit
      </button>


    </header>



    <!-- =================================================
         WATCH LAYOUT
         ================================================= -->

    <section class="watch-layout">


      <!-- ===============================================
           MOVIE
           =============================================== -->

      <div class="movie-section">


        <div
          id="movieTap"
          class="movie-container"
        >


          <!-- MOVIE VIDEO -->

          <video
            id="movie"
            playsinline
            preload="metadata"
          ></video>



          <!-- EMPTY MOVIE STATE -->

          <div
            id="emptyState"
            class="movie-empty"
          >

            <div class="empty-title">
              Choose a movie
            </div>


            <div class="empty-text">
              Pick a movie from your device
            </div>


            <button
              id="chooseMovieBtn"
              type="button"
            >
              Choose movie
            </button>


            <input
              id="movieFile"
              type="file"
              accept="video/mp4,video/webm,.mp4,.webm"
              hidden
            >

          </div>



          <!-- MOVIE CONTROLS -->

          <div class="movie-controls">


            <button
              id="playBtn"
              type="button"
              aria-label="Play or pause"
            >
              ▶
            </button>


            <input
              id="seekBar"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Movie progress"
            >


            <span id="movieTime">
              00:00
            </span>


            <button
              id="muteBtn"
              type="button"
              aria-label="Mute"
            >
              🔊
            </button>


            <button
              id="fullscreenBtn"
              type="button"
              aria-label="Fullscreen"
            >
              ⛶
            </button>


          </div>


        </div>


      </div>



      <!-- ===============================================
           PEOPLE + CHAT
           =============================================== -->

      <aside class="people">


        <!-- =============================================
             YOU
             ============================================= -->

        <div class="person-card">

          <div class="camera-box">


            <video
              id="localVideo"
              autoplay
              muted
              playsinline
            ></video>


            <div class="person-name">
              You
            </div>


          </div>

        </div>



        <!-- =============================================
             PARTNER
             ============================================= -->

        <div class="person-card">

          <div class="camera-box">


            <video
              id="remoteVideo"
              autoplay
              playsinline
            ></video>


            <div class="person-name">
              Partner
            </div>


          </div>

        </div>



        <!-- =============================================
             CHAT
             ============================================= -->

        <div class="chat-panel">


          <div
            id="messages"
            class="messages"
          ></div>


          <form
            id="chatForm"
            class="chat-form"
          >


            <input
              id="chatInput"
              type="text"
              placeholder="Message..."
              autocomplete="off"
            >


            <button
              id="sendChat"
              type="submit"
            >
              Send
            </button>


          </form>


        </div>


      </aside>


    </section>



    <!-- =================================================
         BOTTOM CONTROLS
         ================================================= -->

    <footer class="bottom-controls">


      <!-- MIC -->

      <button
        id="micBtn"
        type="button"
        aria-label="Microphone"
      >
        🎙
      </button>


      <!-- CAMERA -->

      <button
        id="cameraBtn"
        type="button"
        aria-label="Camera"
      >
        📷
      </button>


      <!-- SCREEN -->

      <button
        id="shareBtn"
        type="button"
        aria-label="Share screen"
      >
        🖥
      </button>



      <!-- REACTIONS -->

      <div class="reactions">


        <button
          class="reaction-btn"
          data-emoji="❤️"
          type="button"
          aria-label="Love"
        >
          ❤️
        </button>


        <button
          class="reaction-btn"
          data-emoji="🥰"
          type="button"
          aria-label="Adore"
        >
          🥰
        </button>


        <button
          class="reaction-btn"
          data-emoji="😘"
          type="button"
          aria-label="Kiss"
        >
          😘
        </button>


        <button
          class="reaction-btn"
          data-emoji="😂"
          type="button"
          aria-label="Funny"
        >
          😂
        </button>


        <button
          class="reaction-btn"
          data-emoji="🔥"
          type="button"
          aria-label="Hot"
        >
          🔥
        </button>


      </div>


    </footer>


  </main>



  <!-- =====================================================
       TOAST
       ===================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>



  <!-- =====================================================
       SOCKET.IO
       ===================================================== -->

  <script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js"
  ></script>



  <!-- =====================================================
       MOVIEDATE APP
       ===================================================== -->

  <script src="./app.js"></script>


</body>

</html>
